html/head_include="<style>#cea-nogl{position:fixed;inset:0;z-index:2147483647;background:#05070d;color:#e6f6ff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box;overflow:auto}.cea-card{max-width:540px;background:#0b0f1a;border:2px solid #5aff73;border-radius:16px;padding:24px 22px;text-align:left}.cea-card h1{color:#5aff73;font-size:21px;margin:10px 0 12px;text-align:center}.cea-card p,.cea-card li{font-size:15px;line-height:1.55}.cea-card li{margin:8px 0}.cea-card a{color:#ffd678}.cea-small{font-size:13px!important;opacity:.75;text-align:center}.cea-box{width:44px;height:30px;margin:0 auto;position:relative}.cea-box:before,.cea-box:after{content:'';position:absolute;width:12px;height:12px;border-radius:50%;background:#5aff73;box-shadow:0 0 10px #5aff73}.cea-box:before{left:4px;top:14px}.cea-box:after{left:28px;top:14px}.cea-dot{position:absolute;left:16px;top:0;width:12px;height:12px;border-radius:50%;background:#5aff73;box-shadow:0 0 10px #5aff73}</style><script>(function(){function hasGL2(){if(location.search.indexOf('nogl')>=0)return false;try{var c=document.createElement('canvas');return !!(window.WebGL2RenderingContext&&c.getContext('webgl2'));}catch(e){return false;}}if(hasGL2())return;function show(){if(document.getElementById('cea-nogl'))return;var d=document.createElement('div');d.id='cea-nogl';d.innerHTML='<div class=cea-card><div class=cea-box><span class=cea-dot></span></div><h1>Your browser cannot run the game here (yet)</h1><p>Dimmer Switch needs <b>WebGL 2</b>, a graphics feature most browsers have. It is missing or switched off in this browser.</p><ol><li><b>Chrome or Edge:</b> open Settings, search for <i>graphics acceleration</i>, turn it on, then restart the browser.</li><li><b>Update your browser</b>, or try another one: Chrome, Firefox or Safari. On iPhone or iPad you need iOS 15 or newer.</li><li><b>Or play the desktop version:</b> <a href=https://github.com/ahab94/dimmer-switch/releases/latest target=_blank rel=noopener>free Windows, Mac and Linux downloads</a>.</li></ol><p class=cea-small>Not sure? <a href=https://get.webgl.org/webgl2/ target=_blank rel=noopener>Check WebGL 2 support</a></p></div>';document.body.appendChild(d);}if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',show);}else{show();}})();</script>"

